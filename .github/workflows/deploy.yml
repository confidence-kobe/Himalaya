name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Code Quality Checks
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true

      - name: Check Links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Validate manifest.json
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq empty manifest.json
          echo "✓ manifest.json is valid JSON"

      - name: Check File Sizes
        run: |
          echo "Checking file sizes..."
          find . -type f -size +1M -not -path "./.git/*" | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "⚠️  Large file detected: $file ($size)"
          done
          total_size=$(du -sh . | cut -f1)
          echo "📦 Total project size: $total_size"

      - name: Security Audit
        run: |
          echo "Running security checks..."

          # Check for sensitive data patterns
          if grep -r "API_KEY\|SECRET\|PASSWORD\|TOKEN" --include="*.js" --include="*.html" --exclude-dir=.git .; then
            echo "⚠️  Warning: Potential sensitive data found"
            exit 1
          fi

          # Verify security.txt exists
          if [ ! -f ".well-known/security.txt" ]; then
            echo "❌ security.txt not found"
            exit 1
          fi
          echo "✓ security.txt found"

          # Verify SECURITY.md exists
          if [ ! -f "SECURITY.md" ]; then
            echo "❌ SECURITY.md not found"
            exit 1
          fi
          echo "✓ SECURITY.md found"

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Verify PWA Requirements
        run: |
          echo "Checking PWA requirements..."

          # Check manifest.json
          if [ ! -f "manifest.json" ]; then
            echo "❌ manifest.json not found"
            exit 1
          fi
          echo "✓ manifest.json found"

          # Check Service Worker
          if [ ! -f "sw.js" ]; then
            echo "❌ sw.js not found"
            exit 1
          fi
          echo "✓ Service Worker found"

          # Check icons
          if [ ! -f "icon-192.png" ] || [ ! -f "icon-512.png" ]; then
            echo "❌ PWA icons not found"
            exit 1
          fi
          echo "✓ PWA icons found"

          # Check robots.txt
          if [ ! -f "robots.txt" ]; then
            echo "❌ robots.txt not found"
            exit 1
          fi
          echo "✓ robots.txt found"

          # Check sitemap.xml
          if [ ! -f "sitemap.xml" ]; then
            echo "❌ sitemap.xml not found"
            exit 1
          fi
          echo "✓ sitemap.xml found"

      - name: Generate Build Info
        run: |
          cat > build-info.json << EOF
          {
            "build_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "run_number": "${{ github.run_number }}"
          }
          EOF
          echo "✓ Build info generated"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Success
        run: |
          echo "🚀 Deployment successful!"
          echo "📱 PWA URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🎉 Tibetan Typing Practice is now live!"
